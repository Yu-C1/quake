# NONUMA half of sift1m.yaml. Running both halves in one process crashes at the
# NUMA/non-NUMA transition (mbind failures, then heap corruption), so each mode
# is run separately and the results combined afterwards.
dataset:
  name: sift1m
  num_queries: 100
  k: 1

trials: 3
warmup: 1
overwrite: true

indexes:
  - name: Quake_1_NONUMA
    index: Quake
    build_params:
      nc: 1000
      metric: l2
      num_workers: 1
      use_numa: false
    search_params:
      nprobe: 20

  - name: Quake_2_NONUMA
    index: Quake
    build_params:
      nc: 1000
      metric: l2
      num_workers: 2
      use_numa: false
    search_params:
      nprobe: 20

  - name: Quake_4_NONUMA
    index: Quake
    build_params:
      nc: 1000
      metric: l2
      num_workers: 4
      use_numa: false
    search_params:
      nprobe: 20

  - name: Quake_8_NONUMA
    index: Quake
    build_params:
      nc: 1000
      metric: l2
      num_workers: 8
      use_numa: false
    search_params:
      nprobe: 20

  - name: Quake_16_NONUMA
    index: Quake
    build_params:
      nc: 1000
      metric: l2
      num_workers: 16
      use_numa: false
    search_params:
      nprobe: 20

  - name: Quake_32_NONUMA
    index: Quake
    build_params:
      nc: 1000
      metric: l2
      num_workers: 32
      use_numa: false
    search_params:
      nprobe: 20

  - name: Quake_64_NONUMA
    index: Quake
    build_params:
      nc: 1000
      metric: l2
      num_workers: 64
      use_numa: false
    search_params:
      nprobe: 20

output:
  results_csv: numa_single_query_nonuma_results.csv
