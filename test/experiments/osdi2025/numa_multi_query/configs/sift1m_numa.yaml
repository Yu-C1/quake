# NUMA half of sift1m.yaml. Running both halves in one process crashes at the
# NUMA/non-NUMA transition (mbind failures, then heap corruption), so each mode
# is run separately and the results combined afterwards.
dataset:
  name: sift1m
  num_queries: 1000
  k: 100

trials: 3
warmup: 1
overwrite: false
force_rebuild: false

indexes:
  - name: Quake_0_numa
    index: Quake
    build_params:
      nc: 1000
      metric: l2
      num_workers: 0
      use_numa: true
    search_params:
      nprobe: 20
      batched_scan: false
      n_threads: 16

  - name: Quake_1_numa
    index: Quake
    build_params:
      nc: 1000
      metric: l2
      num_workers: 1
      use_numa: true
    search_params:
      nprobe: 20
      batched_scan: false

  - name: Quake_4_numa
    index: Quake
    build_params:
      nc: 1000
      metric: l2
      num_workers: 4
      use_numa: true
    search_params:
      nprobe: 20
      batched_scan: false

  - name: Quake_16_numa
    index: Quake
    build_params:
      nc: 1000
      metric: l2
      num_workers: 16
      use_numa: true
    search_params:
      nprobe: 20
      batched_scan: false

output:
  results_csv: numa_multi_query_numa_results.csv
